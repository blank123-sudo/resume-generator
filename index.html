<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional ATS Resume</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        @media print {
            @page {
                size: A4;
                margin: 0; 
            }
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                background-color: white !important;
                padding: 0 !important;
                display: block !important;
            }
            #resume-preview {
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                box-shadow: none !important;
                padding: 1.5cm !important;
                margin: 0 !important;
            }
            .page-break-avoid {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen" x-data="resumeApp()">

    <!-- Header (Hidden on Print) -->
    <header class="no-print bg-slate-900 text-white shadow-md py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span>📄</span> ATS Resume Architect (Style Match)
            </h1>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 pb-16 grid grid-cols-1 lg:grid-cols-12 gap-8 print-container">
        
        <!-- Input & Controls Section (Hidden on Print) -->
        <section class="no-print lg:col-span-5 bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-6 overflow-y-auto max-h-[85vh]">
            <h2 class="text-lg font-semibold text-slate-900 border-b pb-2">1. Personal & Contact Details</h2>
            
            <div class="space-y-4 text-sm">
                <!-- Profile Picture Management -->
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Profile Photo (Optional)</label>
                    <div class="flex items-center gap-4">
                        <div class="w-16 h-16 rounded-full bg-slate-100 border border-slate-300 overflow-hidden flex items-center justify-center shrink-0">
                            <template x-if="resume.photo">
                                <img :src="resume.photo" class="w-full h-full object-cover">
                            </template>
                            <template x-if="!resume.photo">
                                <span class="text-xs text-slate-400">No Photo</span>
                            </template>
                        </div>
                        <div class="space-y-2 flex-1">
                            <div class="flex gap-2">
                                <label class="cursor-pointer bg-slate-900 hover:bg-slate-800 text-white text-xs px-3 py-1.5 rounded transition inline-block">
                                    Upload File
                                    <input type="file" accept="image/*" @change="handleFileUpload" class="hidden">
                                </label>
                                <button type="button" @click="startWebcam()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded transition">
                                    Use Webcam
                                </button>
                                <button type="button" @click="removePhoto()" x-show="resume.photo" class="text-red-500 hover:text-red-700 text-xs font-medium px-2 py-1.5">
                                    Remove
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Webcam Modal / Inline Box -->
                    <div x-show="webcamActive" class="mt-3 p-3 bg-slate-50 border rounded-lg space-y-2">
                        <div class="relative bg-black rounded overflow-hidden aspect-video flex justify-center items-center">
                            <video x-ref="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                        </div>
                        <canvas x-ref="webcamCanvas" class="hidden"></canvas>
                        <div class="flex justify-end gap-2">
                            <button type="button" @click="stopWebcam()" class="px-3 py-1 bg-slate-300 hover:bg-slate-400 text-slate-800 rounded text-xs font-medium">Cancel</button>
                            <button type="button" @click="captureWebcam()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-medium">Capture Photo</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-700">Full Name</label>
                    <input type="text" x-model="resume.name" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700">Location</label>
                        <input type="text" x-model="resume.location" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700">Email</label>
                        <input type="email" x-model="resume.email" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700">Phone</label>
                        <input type="text" x-model="resume.phone" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700">LinkedIn / Portfolio URL (Optional)</label>
                        <input type="text" x-model="resume.linkedin" placeholder="Leave blank to hide" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-medium text-slate-700">Professional Summary</label>
                    <textarea x-model="resume.summary" rows="3" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none"></textarea>
                </div>
            </div>

            <!-- Professional Experience Inputs -->
            <div class="flex justify-between items-center border-b pb-2 pt-2">
                <h2 class="text-lg font-semibold text-slate-900">2. Professional Experience</h2>
                <button @click="addExperienceSlot()" class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-md hover:bg-slate-800 transition">+ Add Job</button>
            </div>

            <div class="space-y-4">
                <template x-for="(exp, index) in experienceInputs" :key="index">
                    <div class="p-4 bg-slate-50 border border-slate-200 rounded-lg space-y-3 relative text-sm">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-xs text-slate-500 uppercase tracking-wider" x-text="`Job #${index + 1}`"></span>
                            <button @click="removeExperienceSlot(index)" x-show="experienceInputs.length > 1" class="text-red-500 hover:text-red-700 text-xs font-medium">Remove</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-700">Company Name</label>
                                <input type="text" x-model="exp.company" class="mt-1 w-full p-2 bg-white border rounded focus:ring-1 focus:ring-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-700">Location</label>
                                <input type="text" x-model="exp.location" class="mt-1 w-full p-2 bg-white border rounded focus:ring-1 focus:ring-slate-900">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-medium text-slate-700">Job Title</label>
                                <input type="text" x-model="exp.role" class="mt-1 w-full p-2 bg-white border rounded focus:ring-1 focus:ring-slate-900">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-700">Period Active</label>
                                <input type="text" x-model="exp.period" class="mt-1 w-full p-2 bg-white border rounded focus:ring-1 focus:ring-slate-900">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-700">Bullets (Separate with periods)</label>
                            <textarea x-model="exp.tasks" rows="3" class="mt-1 w-full p-2 bg-white border rounded focus:ring-1 focus:ring-slate-900"></textarea>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Education Inputs -->
            <h2 class="text-lg font-semibold text-slate-900 border-b pb-2 pt-2">3. Education</h2>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block font-medium text-slate-700">Degree & Major</label>
                    <input type="text" x-model="education.degree" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700">Institution</label>
                        <input type="text" x-model="education.school" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700">Honors & Year</label>
                        <input type="text" x-model="education.details" class="mt-1 w-full p-2 border rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none">
                    </div>
                </div>
            </div>

            <!-- Skills Inputs -->
            <div class="flex justify-between items-center border-b pb-2 pt-2">
                <h2 class="text-lg font-semibold text-slate-900">4. Expert-Level Skills Categories</h2>
                <button @click="addSkillSlot()" class="text-xs bg-slate-900 text-white px-3 py-1.5 rounded-md hover:bg-slate-800 transition">+ Add Skill</button>
            </div>
            <div class="space-y-3 text-sm">
                <template x-for="(cat, index) in skillCategories" :key="index">
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-lg space-y-2 relative">
                        <div class="flex justify-between items-center">
                            <span class="font-semibold text-xs text-slate-500 uppercase tracking-wider" x-text="`Skill Category #${index + 1}`"></span>
                            <button @click="removeSkillSlot(index)" x-show="skillCategories.length > 1" class="text-red-500 hover:text-red-700 text-xs font-medium">Remove</button>
                        </div>
                        <div class="flex gap-2 items-center">
                            <input type="text" x-model="cat.name" placeholder="Category Name" class="w-1/3 p-2 bg-white border rounded text-xs font-medium">
                            <input type="text" x-model="cat.skills" placeholder="Comma separated skills" class="w-2/3 p-2 bg-white border rounded text-xs">
                        </div>
                    </div>
                </template>
            </div>

            <div class="space-y-2 pt-4">
                <button @click="syncData()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm flex items-center justify-center gap-2">
                    <span>✨</span> Refresh Preview
                </button>
                <button @click="printResume()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 px-4 rounded-lg transition text-sm flex items-center justify-center gap-2">
                    <span>📥</span> Save as ATS PDF
                </button>
            </div>
        </section>

        <!-- Live Preview Section -->
        <section class="lg:col-span-7 bg-slate-200 sm:p-6 rounded-xl flex justify-center overflow-x-auto print-container">
            
            <div id="resume-preview" class="bg-white w-[794px] min-h-[1123px] shrink-0 p-10 sm:p-12 shadow-xl text-slate-900 text-[13px] leading-snug">
                
                <!-- Header Name & Contact with Icons and Optional Photo -->
                <div class="flex items-center gap-5 pb-3 mb-4" :class="resume.photo ? 'justify-start' : 'justify-center text-center'">
                    <template x-if="resume.photo">
                        <div class="w-20 h-20 rounded-full border border-slate-300 overflow-hidden shrink-0 shadow-sm">
                            <img :src="resume.photo" class="w-full h-full object-cover">
                        </div>
                    </template>
                    <div :class="resume.photo ? 'text-left flex-1' : 'w-full text-center'">
                        <h2 class="text-2xl font-serif font-bold tracking-wide uppercase text-slate-900" x-text="resume.name"></h2>
                        <div class="flex items-center flex-wrap gap-x-5 gap-y-1 text-xs text-slate-700 mt-1" :class="resume.photo ? 'justify-start' : 'justify-center'">
                            <!-- Location -->
                            <div class="flex items-center gap-1.5" x-show="resume.location">
                                <svg class="w-3.5 h-3.5 text-slate-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
                                <span x-text="resume.location"></span>
                            </div>
                            <!-- Email -->
                            <div class="flex items-center gap-1.5" x-show="resume.email">
                                <svg class="w-3.5 h-3.5 text-slate-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                                <span x-text="resume.email"></span>
                            </div>
                            <!-- Phone -->
                            <div class="flex items-center gap-1.5" x-show="resume.phone">
                                <svg class="w-3.5 h-3.5 text-slate-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                                <span x-text="resume.phone"></span>
                            </div>
                            <!-- LinkedIn / Portfolio -->
                            <div class="flex items-center gap-1.5" x-show="resume.linkedin && resume.linkedin.trim() !== ''">
                                <svg class="w-3.5 h-3.5 text-slate-600 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                                <span x-text="resume.linkedin"></span>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="border-slate-300 mb-5">

                <!-- Professional Summary -->
                <div class="mb-5 page-break-avoid" x-show="resume.summary">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-center text-slate-900 mb-2">Professional Summary</h3>
                    <p class="text-justify text-slate-700" x-text="resume.summary"></p>
                </div>

                <!-- Professional Experience -->
                <div class="mb-5">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-center text-slate-900 border-b border-slate-300 pb-1 mb-3">Professional Experience</h3>
                    
                    <template x-for="exp in resume.experiences" :key="exp.company">
                        <div class="mb-4 page-break-avoid">
                            <div class="flex justify-between items-baseline font-bold text-slate-900">
                                <span x-text="exp.company"></span>
                                <span class="font-normal text-xs text-slate-700" x-text="exp.location"></span>
                            </div>
                            <div class="flex justify-between items-baseline mb-1">
                                <span class="italic text-slate-800 font-medium" x-text="exp.role"></span>
                                <span class="text-xs text-slate-700" x-text="exp.period"></span>
                            </div>
                            <ul class="list-disc pl-4 space-y-1 text-slate-700">
                                <template x-for="bullet in exp.bullets">
                                    <li x-text="bullet"></li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>

                <!-- Education -->
                <div class="mb-5 page-break-avoid">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-center text-slate-900 border-b border-slate-300 pb-1 mb-3">Education</h3>
                    <div class="flex justify-between items-baseline">
                        <div>
                            <span class="font-bold text-slate-900" x-text="education.degree"></span>
                            <div class="italic text-slate-700" x-text="education.school"></div>
                        </div>
                        <div class="text-right text-xs text-slate-700" x-text="education.details"></div>
                    </div>
                </div>

                <!-- Expert-Level Skills -->
                <div class="page-break-avoid">
                    <h3 class="text-xs font-bold uppercase tracking-widest text-center text-slate-900 border-b border-slate-300 pb-1 mb-3">Expert-Level Skills</h3>
                    <div class="space-y-1 text-slate-700 text-xs">
                        <template x-for="cat in skillCategories" :key="cat.name">
                            <div>
                                <span class="font-bold text-slate-900" x-text="cat.name + ': '"></span>
                                <span x-text="cat.skills"></span>
                            </div>
                        </template>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Application Script Logic -->
    <script>
        function resumeApp() {
            return {
                resume: {
                    name: 'Alex Morgan',
                    location: 'San Francisco, CA',
                    email: 'alex.morgan@example.com',
                    phone: '(555) 123-4567',
                    linkedin: 'in/alexmorgan',
                    photo: '',
                    summary: 'Results-driven Software Engineer with over 5 years of experience designing and building scalable web applications. Passionate about clean code, user-centric design, and optimizing system performance.',
                    experiences: [
                        {
                            company: 'TechCorp Industries',
                            location: 'San Francisco, CA',
                            role: 'Senior Frontend Developer',
                            period: 'January 2022—Present',
                            bullets: [
                                'Spearheaded the frontend redesign of the core SaaS platform using React and Tailwind CSS, increasing user engagement by 35%.',
                                'Mentored junior developers and established code review guidelines to ensure high software quality standards.'
                            ]
                        }
                    ]
                },
                webcamActive: false,
                webcamStream: null,
                experienceInputs: [
                    {
                        company: 'TechCorp Industries',
                        location: 'San Francisco, CA',
                        role: 'Senior Frontend Developer',
                        period: 'January 2022—Present',
                        tasks: 'Spearheaded the frontend redesign of the core SaaS platform using React and Tailwind CSS, increasing user engagement by 35%. Mentored junior developers and established code review guidelines to ensure high software quality standards.'
                    }
                ],
                education: {
                    degree: 'Bachelor of Science in Computer Science',
                    school: 'University of California, Berkeley',
                    details: 'Magna Cum Laude | 2019'
                },
                skillCategories: [
                    { name: 'Frontend Development', skills: 'React, JavaScript (ES6+), Tailwind CSS, HTML5, CSS3' }
                ],
                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.resume.photo = e.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },
                startWebcam() {
                    this.webcamActive = true;
                    navigator.mediaDevices.getUserMedia({ video: true })
                        .then(stream => {
                            this.webcamStream = stream;
                            this.$refs.webcamVideo.srcObject = stream;
                        })
                        .catch(err => {
                            alert("Unable to access webcam. Please check permissions.");
                            this.webcamActive = false;
                        });
                },
                captureWebcam() {
                    const video = this.$refs.webcamVideo;
                    const canvas = this.$refs.webcamCanvas;
                    canvas.width = video.videoWidth || 320;
                    canvas.height = video.videoHeight || 240;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    this.resume.photo = canvas.toDataURL('image/png');
                    this.stopWebcam();
                },
                stopWebcam() {
                    if (this.webcamStream) {
                        this.webcamStream.getTracks().forEach(track => track.stop());
                        this.webcamStream = null;
                    }
                    this.webcamActive = false;
                },
                removePhoto() {
                    this.resume.photo = '';
                },
                addSkillSlot() {
                    this.skillCategories.push({ name: '', skills: '' });
                },
                removeSkillSlot(index) {
                    this.skillCategories.splice(index, 1);
                },
                addExperienceSlot() {
                    this.experienceInputs.push({ company: '', location: '', role: '', period: '', tasks: '' });
                },
                removeExperienceSlot(index) {
                    this.experienceInputs.splice(index, 1);
                },
                syncData() {
                    this.resume.experiences = this.experienceInputs.map(exp => ({
                        company: exp.company,
                        location: exp.location,
                        role: exp.role,
                        period: exp.period,
                        bullets: exp.tasks ? exp.tasks.split(/\.\s*|\n/).filter(b => b.trim().length > 0).map(b => b.trim() + '.') : []
                    }));
                },
                printResume() {
                    window.print();
                }
            }
        }
    </script>
</body>
</html>
